<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Compatibility Driver</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600" />
    <link rel="stylesheet" href="main.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <h1>Phone Compatibility Driver</h1>
    </header>
    <main>
        <section>
            <h2>Check Your Phone's Compatibility</h2>
            <p>Enter your phone's model and we'll check its compatibility with our advanced phone features.</p>
            <form>
                <input type="text" id="model" placeholder="Enter your phone's model">
                <button type="submit">Check Compatibility</button>
            </form>
        </section>
    </main>
</body>
</html>
